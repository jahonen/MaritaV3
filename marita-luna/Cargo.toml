[package]
name = "marita-luna"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marita-luna"
path = "src/main.rs"

[dependencies]
marita-grpc = { path = "../marita-grpc" }
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tonic = "0.12"
anyhow = "1.0"
