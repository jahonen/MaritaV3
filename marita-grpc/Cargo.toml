[package]
name = "marita-grpc"
version.workspace = true
edition.workspace = true

[dependencies]
marita-core = { path = "../marita-core" }
anyhow = "1.0"
glam = "0.29"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

[build-dependencies]
tonic-build = "0.12"
