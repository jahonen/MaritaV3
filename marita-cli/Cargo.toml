[package]
name = "marita-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "marita"
path = "src/main.rs"

[dependencies]
marita-core = { path = "../marita-core" }
marita-grpc = { path = "../marita-grpc" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
